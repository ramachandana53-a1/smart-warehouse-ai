  <body>
    <script>
      // Silence benign Vite HMR websocket reconnection noise in sandbox preview
      const _origError = console.error;
      console.error = function (...args) {
        if (args.some(arg => typeof arg === 'string' && (arg.includes('[vite]') || arg.includes('websocket') || arg.includes('WebSocket')))) {
          return;
        }
        _origError.apply(console, args);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
